name: testinng-1534

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update yarn
        run: yarn set version 4.14.1
      - run: yarn --version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install
